# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# InventoryX uses PostgreSQL (Npgsql). The build job provisions a Postgres 16
# service container for integration tests and future migration verification.
# Presentation tests currently use Sqlite in-memory; the Postgres connection
# string is available for any job that needs a live database.

name: Build and test ASP.NET Core app (PostgreSQL) — deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: InventoryX
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=InventoryX;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v6
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build InventoryX.sln --configuration Release

      - name: Run tests
        run: dotnet test InventoryX.sln -c Release --no-build

      - name: dotnet publish
        run: dotnet publish InventoryX.Presentation/InventoryX.Presentation.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp --no-build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v6
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_99745E165F7C484AA9BB45E31326196A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_40D55244F9B04245A6B842FE555004D4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93C375D2C4664ECA8BB26FD633EADC8F }}

      # The deployed app requires a PostgreSQL connection string
      # (ConnectionStrings__DefaultConnection) configured in Azure App Service.
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'InventoryX'
          slot-name: 'Production'
          package: .
